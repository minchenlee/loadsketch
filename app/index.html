    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Pick the theme before first paint: ?theme=, then the saved choice, then the system setting.
      (function () {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = null;
        try { saved = localStorage.getItem('loadsketch-theme'); } catch (e) {}
        var t = q || saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html, body { background: #fbfbfb; }
      html.dark, html.dark body { background: #030303; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
