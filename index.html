    <script>
      // A share link (#s=…) made before the simulator moved to /app/: open it there.
      if (location.hash.indexOf('#s=') === 0) location.replace('./app/' + location.search + location.hash);
    </script>
    <script>
      // Pick the theme before first paint: ?theme=, then the saved choice, then the system setting.
      (function () {
        var q = new URLSearchParams(location.search).get('theme');
        var saved = null;
        try { saved = localStorage.getItem('loadsketch-theme'); } catch (e) {}
        var t = q || saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
