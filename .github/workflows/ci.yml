name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # nightly on main: every message must have Traditional Chinese

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zh-complete:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Every message has Traditional Chinese
        run: npm run i18n:strict

  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Quick unit tests and i18n check
        run: npm run test:quick

      - name: Golden test (every example gives the same numbers)
        run: npx vitest run tests/golden.test.ts

      - name: Design briefs (the reference design passes, the first design does not)
        run: npx vitest run tests/briefs.test.ts

      - name: AGENTS.md check
        run: node scripts/check-agents-md.ts

      - name: Accuracy report is up to date (docs/accuracy.md)
        run: node scripts/accuracy.ts --check

      - name: AI guide is up to date
        run: node scripts/ai-guide.ts --check

      - name: Build
        run: npm run build

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The Playwright image has Chromium and its system libraries, so there is no apt step that can
    # fail. Its version must be the same as @playwright/test in package-lock.json; the first step
    # after the install checks this. Change both together.
    container: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 30
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.61.0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The container and @playwright/test are the same version
        run: |
          installed=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the container is $PLAYWRIGHT_IMAGE_VERSION. Change the container tag and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/ci.yml."
            exit 1
          fi

      # A test that fails is run again, up to 2 times. One that then passes is reported as flaky,
      # with a trace of the retry in the uploaded results.
      - name: End-to-end tests (headless)
        run: npx playwright test --retries=2 --trace=on-first-retry --reporter=list,github

      - name: Upload the results (traces of failed and retried tests)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
